<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Damage Assessment Wireframes</title>
<style>
:root {
  color-scheme: light;
  --ink: #1f2328; --muted: #56606c; --line: #c9ced6; --soft: #eef0f3; --paper: #f6f7f9; --white: #fff;
  --accent: #1f5fbf; --intact: #13705d; --damaged: #8a5a00; --destroyed: #b3261e;
  --warn-bg: #fff4e0; --warn-line: #c98a1b; --ok-bg: #e8f4ee; --ok-line: #13705d;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 26px; line-height: 1.2; }
h2 { font-size: 18px; line-height: 1.3; }
h3 { font-size: 14px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.stack > * + * { margin-top: 12px; }

/* The viewer around the screens */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--white); border-bottom: 1px solid var(--line); }
.bar strong { font-size: 15px; }
.bar .tag { font-size: 12.5px; color: var(--muted); }
.bar .tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.viewer { display: grid; grid-template-columns: 210px minmax(0, 1fr) 270px; gap: 16px; padding: 16px; max-width: 1500px; margin: 0 auto; align-items: start; }
.rail h3 { margin: 14px 0 4px; color: var(--muted); font-weight: 600; font-size: 12.5px; }
.rail h3:first-child { margin-top: 0; }
.rail button { display: block; width: 100%; text-align: left; padding: 7px 9px; background: none; border: 1px solid transparent; border-radius: 6px; }
.rail button:hover { background: var(--soft); }
.rail button[aria-current="page"] { background: var(--white); border-color: var(--line); font-weight: 600; }
.railselect { display: none; width: 100%; padding: 9px; background: var(--white); border: 1px solid var(--line); border-radius: 6px; }
.notes { background: var(--white); border: 1px dashed var(--line); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; }
.notes h3 { margin-top: 12px; color: var(--muted); font-weight: 600; font-size: 12.5px; }
.notes h3:first-child { margin-top: 0; }
.notes ul { margin: 4px 0 0; padding-left: 18px; }
.nonotes .viewer { grid-template-columns: 210px minmax(0, 1fr); }
.nonotes .notes { display: none; }
select.small, .pick { padding: 5px 8px; background: var(--white); border: 1px solid var(--line); border-radius: 6px; max-width: 100%; }

/* The screen itself */
.frame { background: var(--white); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.chrome { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 7px 12px; background: var(--soft); border-bottom: 1px solid var(--line); }
.url { flex: 1 1 140px; min-width: 0; padding: 2px 10px; background: var(--white); border: 1px solid var(--line); border-radius: 12px; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-block; padding: 1px 9px; border: 1px solid var(--line); border-radius: 12px; background: var(--white); font-size: 12px; white-space: nowrap; }
.chip.warn { border-color: var(--warn-line); background: var(--warn-bg); }
.chip.ok { border-color: var(--ok-line); background: var(--ok-bg); }
.topnav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.topnav .brand { font-weight: 700; margin-right: 6px; }
.link { background: none; border: 0; padding: 2px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.page { padding: 16px; }
.btn { padding: 8px 14px; background: var(--white); border: 1px solid var(--ink); border-radius: 6px; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--ink); color: var(--white); }
.btn.primary:hover { background: #3a4048; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
.steps button { padding: 4px 10px; background: var(--white); border: 1px solid var(--line); border-radius: 14px; font-size: 13px; }
.steps button[aria-current="step"] { background: var(--ink); color: var(--white); border-color: var(--ink); }
.two { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.box.dashed { border-style: dashed; color: var(--muted); }
.ph { display: block; height: 9px; margin: 7px 0; background: var(--soft); border-radius: 4px; }
.banner { padding: 10px 12px; border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 8px; }
.banner.ok { border-color: var(--ok-line); background: var(--ok-bg); }
.banner + * { margin-top: 12px; }
.video { display: grid; place-items: center; min-height: 120px; background: var(--soft); border-radius: 6px; color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.scroll { overflow-x: auto; }

/* Scene */
.scenewrap { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); line-height: 0; }
svg.scene { display: block; width: 100%; height: auto; }
.sliderrow { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; }
.sliderrow input { flex: 1; min-width: 0; }
.bldg { cursor: pointer; outline: none; }
.bx { fill: transparent; stroke-width: 6; vector-effect: non-scaling-stroke; }
.bldg .bx { stroke-width: 2.4; }
.c1 .bx { stroke: var(--intact); }
.c2 .bx { stroke: var(--damaged); stroke-dasharray: 7 4; }
.c3 .bx, .c3 .xm { stroke: var(--destroyed); }
.c3 .bx { stroke-width: 3.2; }
.xm { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; pointer-events: none; }
.bldg:hover .bx, .bldg:focus .bx { fill: rgba(31, 95, 191, .22); }
.bldg:focus-visible .bx { stroke: var(--accent); stroke-width: 4; stroke-dasharray: none; }
.bldg.sel .bx { fill: rgba(31, 95, 191, .26); stroke: var(--accent); stroke-width: 4.5; stroke-dasharray: none; }
.bldg.dim { opacity: .18; }
.mk { font: 700 38px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }

/* Damage keys, counts and lists */
.key { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 14px; border: 2px solid; background: var(--white); flex: none; }
.sw.c1 { border-color: var(--intact); }
.sw.c2 { border-color: var(--damaged); border-style: dashed; }
.sw.c3 { border-color: var(--destroyed); background: linear-gradient(45deg, transparent 44%, var(--destroyed) 44%, var(--destroyed) 56%, transparent 56%); }
.counts { display: grid; gap: 6px; }
.count { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 7px 10px; background: var(--white); border: 1px solid var(--line); border-radius: 6px; text-align: left; }
.count:hover { background: var(--soft); }
.count[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.count b { font-size: 18px; }
.layers { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; }
.facts { width: 100%; font-size: 13.5px; }
.facts td:first-child { color: var(--muted); width: 55%; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tabs button { padding: 6px 10px; background: none; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; font-size: 13px; }
.tabs button[aria-selected="true"] { background: var(--soft); border-color: var(--line); font-weight: 600; }

/* Chain */
.chain { list-style: none; margin: 0; padding: 0; }
.chain li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--soft); opacity: .45; }
.chain li.done, .chain li.now { opacity: 1; }
.chain li.fail { opacity: 1; }
.dot { display: grid; place-items: center; width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 50%; font-size: 13px; background: var(--white); }
.done .dot { background: var(--ink); border-color: var(--ink); color: var(--white); }
.now .dot { border: 2px solid var(--ink); }
.fail .dot { background: var(--warn-bg); border-color: var(--warn-line); }

/* Gallery */
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.card { padding: 8px; background: var(--white); border: 1px solid var(--line); border-radius: 8px; text-align: left; min-width: 0; }
.card:hover { background: var(--soft); }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.thumb { display: block; width: 100%; height: 76px; background: var(--soft); border-radius: 4px; margin-bottom: 6px; overflow: hidden; }
.drop { display: grid; place-items: center; min-height: 92px; border: 2px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
.drop.missing { border-color: var(--warn-line); background: var(--warn-bg); color: var(--ink); }

/* Questions and report */
.q { display: block; width: 100%; padding: 8px 10px; margin-bottom: 6px; text-align: left; background: var(--white); border: 1px solid var(--line); border-radius: 6px; }
.q:hover { background: var(--soft); }
.q[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.fill { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; }
.answer b { font-size: 22px; }
pre.sql { margin: 8px 0 0; padding: 8px 10px; background: var(--soft); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.rpt { min-height: 132px; line-height: 1.6; }
.cite { padding: 0 5px; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; font: 12px ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
.cite:hover { border-color: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.bars { display: grid; gap: 10px; }
.meter { position: relative; height: 12px; background: var(--soft); border-radius: 6px; margin-top: 4px; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 6px; }
.meter u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--destroyed); }

@media (max-width: 1180px) {
  .viewer { grid-template-columns: 190px minmax(0, 1fr); }
  .notes { grid-column: 2; }
}
@media (max-width: 760px) {
  .viewer, .nonotes .viewer { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
  .notes { grid-column: 1; }
  .rail { display: none; }
  .railselect { display: block; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid3 { grid-template-columns: minmax(0, 1fr); }
  .page { padding: 12px; }
  h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) {
  .chain li { transition: opacity .25s; }
}
</style>
</head>
<body>
<header class="bar">
  <strong>Damage Assessment Wireframes</strong>
  <span class="tag">Layout and flow only. The town is made up, and numbers are samples unless marked measured.</span>
  <div class="tools">
    <label class="small">Show state
      <select class="small" id="scenario">
        <option value="normal">Normal</option>
        <option value="nobefore">No before-photo</option>
        <option value="nofacts">Facts missing</option>
        <option value="nogpu">No GPU at the booth</option>
      </select>
    </label>
    <label class="small"><input type="checkbox" id="notesToggle" checked> Notes</label>
  </div>
</header>
<div class="viewer">
  <div>
    <label class="railselect-wrap"><span class="small muted" hidden>Screen</span>
      <select class="railselect" id="railSelect" aria-label="Choose a screen"></select>
    </label>
    <nav class="rail" id="rail" aria-label="Screens"></nav>
  </div>
  <main class="frame" id="frame"></main>
  <aside class="notes" id="notes" aria-label="Notes on this screen"></aside>
</div>

<script>
(function () {
  'use strict';

  /* ---------- The sample town: made up, so it can't be mistaken for a result ---------- */
  const NAMES = { 1: 'Intact', 2: 'Damaged', 3: 'Destroyed' };
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const B = [];
  [50, 190, 330, 570, 710, 850].forEach(y0 => [50, 190, 330, 570, 710, 850].forEach(x0 => {
    if (rnd() < 0.14) return;
    const w = 60 + Math.round(rnd() * 40), h = 50 + Math.round(rnd() * 40);
    const x = x0 + Math.round(rnd() * 14), y = y0 + Math.round(rnd() * 14);
    const cx = x + w / 2, cy = y + h / 2;
    const d1 = Math.hypot(cx - 300, cy - 700), d2 = Math.hypot(cx - 790, cy - 230);
    const c = (d1 < 190 || d2 < 95) ? 3 : (d1 < 330 || d2 < 190) ? 2 : 1;
    B.push({ id: B.length + 1, x, y, w, h, cx, cy, c, area: w * h });
  }));
  B.forEach(b => {
    const ds = B.filter(o => o.c === 3 && o !== b).map(o => Math.hypot(o.cx - b.cx, o.cy - b.cy));
    b.dist = ds.length ? Math.round(Math.min(...ds)) : null;
  });
  const count = c => B.filter(b => b.c === c).length;

  function where(x, y) {
    const ns = y < 341 ? 'north' : y > 683 ? 'south' : '', ew = x < 341 ? 'west' : x > 683 ? 'east' : '';
    return (ns && ew) ? ns + '-' + ew : (ns || ew || 'centre');
  }
  const DMG = B.filter(b => b.c > 1);
  const HOT = [];
  DMG.map(b => ({ b, s: DMG.reduce((t, o) => t + (Math.hypot(o.cx - b.cx, o.cy - b.cy) < 200 ? (o.c === 3 ? 2 : 1) : 0), 0) }))
    .sort((p, q) => q.s - p.s)
    .forEach(({ b }) => {
      if (HOT.length < 3 && HOT.every(h => Math.hypot(h.x - b.cx, h.y - b.cy) > 220)) {
        HOT.push({ n: HOT.length + 1, x: b.cx, y: b.cy, where: where(b.cx, b.cy) });
      }
    });
  const SAFE = [[520, 40], [520, 985], [985, 490], [40, 490], [985, 985], [985, 40], [40, 40], [40, 985]]
    .map(([x, y]) => ({ x, y, d: Math.round(Math.min(...DMG.map(b => Math.hypot(b.cx - x, b.cy - y)))), where: where(x, y) }))
    .sort((p, q) => q.d - p.d).slice(0, 3).map((s, i) => ({ ...s, n: i + 1 }));

  /* ---------- What the viewer is showing ---------- */
  const SCREENS = [
    { id: 's1', group: 'Story site', name: 'Story page', url: '/' },
    { id: 's2', group: 'Demo', name: 'Choose a pair', url: '/demo' },
    { id: 's3', group: 'Demo', name: 'Run the chain', url: '/demo/run' },
    { id: 's4', group: 'Demo', name: 'Damage map', url: '/demo/map' },
    { id: 's5', group: 'Demo', name: 'Heatmap', url: '/demo/heatmap' },
    { id: 's6', group: 'Demo', name: 'Questions', url: '/demo/questions' },
    { id: 's7', group: 'Demo', name: 'Report', url: '/demo/report' },
    { id: 's8', group: 'Results', name: 'Benchmark and limits', url: '/results' },
  ];
  const DEMO_STEPS = [['s2', 'Choose'], ['s3', 'Run'], ['s4', 'Damage map'], ['s5', 'Heatmap'], ['s6', 'Questions'], ['s7', 'Report']];
  const GALLERY = ['Turkey earthquake', 'Santa Rosa wildfire', 'Hurricane Harvey', 'Palu tsunami', 'Moore tornado', 'Hurricane Florence'];
  const S = {
    screen: 's1', scenario: 'normal', pair: 0, slider: 50,
    layers: { 1: true, 2: true, 3: true }, selected: null, highlight: null,
    tmpl: 0, cls: 'destroyed', part: 'whole', dist: 100, size: 5000, showSql: false,
    heatOn: true, spot: null, tab: 0, cite: null, mapView: 'map', chainDone: false,
  };
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timers = [];
  const clearTimers = () => { timers.forEach(clearInterval); timers = []; };
  const noFacts = () => S.scenario === 'nofacts';
  const noBefore = () => S.scenario === 'nobefore';
  const noGpu = () => S.scenario === 'nogpu';

  /* ---------- The scene ---------- */
  function rubble(b) {
    let r = b.id * 97 + 11, out = '';
    const next = () => (r = (r * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 12; i++) {
      const w = 6 + next() * 14, h = 5 + next() * 12;
      out += `<rect x="${(b.x + next() * (b.w - w)).toFixed(0)}" y="${(b.y + next() * (b.h - h)).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="${next() > .5 ? '#b3a99b' : '#9b948a'}"/>`;
    }
    return out;
  }
  function ground(fill) {
    return `<rect width="1024" height="1024" fill="${fill}"/><rect x="500" width="40" height="1024" fill="#cfd3da"/><rect y="470" width="1024" height="40" fill="#cfd3da"/>`;
  }
  const beforeLayer = () => ground('#e6e8ec') + B.map(b => `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="#8d96a3" stroke="#6f7884" stroke-width="2"/>`).join('');
  function afterLayer() {
    return ground('#e1e3e7') +
      `<circle cx="300" cy="700" r="210" fill="#d6d1c9"/><circle cx="790" cy="230" r="110" fill="#d6d1c9"/>` +
      B.map(b => {
        if (b.c === 3) return rubble(b);
        if (b.c === 2) {
          const cut = Math.round(Math.min(b.w, b.h) * .45);
          return `<polygon points="${b.x},${b.y} ${b.x + b.w - cut},${b.y} ${b.x + b.w},${b.y + cut} ${b.x + b.w},${b.y + b.h} ${b.x},${b.y + b.h}" fill="#a2a8b1" stroke="#6f7884" stroke-width="2"/>`;
        }
        return `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="#8d96a3" stroke="#6f7884" stroke-width="2"/>`;
      }).join('');
  }
  function overlayLayer(interactive, hi) {
    return B.filter(b => S.layers[b.c]).map(b => {
      const dim = hi && !hi.includes(b.id) ? ' dim' : '';
      const sel = S.selected === b.id ? ' sel' : '';
      const a = interactive ? `tabindex="0" role="button" data-act="pick" data-id="${b.id}" aria-label="Building ${b.id}, ${NAMES[b.c].toLowerCase()}"` : '';
      const x = b.c === 3 ? `<path class="xm" d="M${b.x} ${b.y}L${b.x + b.w} ${b.y + b.h}M${b.x + b.w} ${b.y}L${b.x} ${b.y + b.h}"/>` : '';
      return `<g class="bldg c${b.c}${dim}${sel}" ${a}><rect class="bx" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>${x}</g>`;
    }).join('');
  }
  function heatLayer() {
    return `<defs><radialGradient id="heatG"><stop offset="0" stop-color="#b3261e" stop-opacity=".62"/><stop offset="1" stop-color="#b3261e" stop-opacity="0"/></radialGradient></defs>` +
      DMG.map(b => `<circle cx="${b.cx}" cy="${b.cy}" r="${b.c === 3 ? 170 : 110}" fill="url(#heatG)"/>`).join('');
  }
  function spotLayer() {
    const on = S.spot;
    return HOT.map(h => `<g tabindex="0" role="button" data-act="spot" data-id="h${h.n}" aria-label="Hot spot ${h.n}, ${h.where}" style="cursor:pointer"><circle cx="${h.x}" cy="${h.y}" r="${on === 'h' + h.n ? 80 : 62}" fill="rgba(255,255,255,.55)" stroke="#b3261e" stroke-width="${on === 'h' + h.n ? 10 : 6}"/><text class="mk" x="${h.x}" y="${h.y}" fill="#b3261e">${h.n}</text></g>`).join('') +
      SAFE.map(s => `<g tabindex="0" role="button" data-act="spot" data-id="s${s.n}" aria-label="Safest area ${s.n}, ${s.where}" style="cursor:pointer"><rect x="${s.x - 34}" y="${s.y - 34}" width="68" height="68" fill="rgba(255,255,255,.8)" stroke="#13705d" stroke-width="${on === 's' + s.n ? 10 : 5}"/><text class="mk" x="${s.x}" y="${s.y}" fill="#13705d" style="font-size:30px">S${s.n}</text></g>`).join('');
  }
  function scene(o) {
    const pos = 1024 * S.slider / 100;
    const compare = o.compare && !noBefore();
    const after = compare ? `<g clip-path="url(#afterClip)">${afterLayer()}</g>` : afterLayer();
    return `<div class="scenewrap"><svg class="scene" viewBox="0 0 1024 1024" role="group" aria-label="${o.label || 'Sample town'}">
      ${compare ? `<defs><clipPath id="afterClip"><rect id="clipRect" x="${pos}" y="0" width="${1024 - pos}" height="1024"/></clipPath></defs>${beforeLayer()}` : ''}
      ${after}
      ${o.heat ? heatLayer() : ''}
      ${o.overlay ? overlayLayer(o.interactive, o.hi !== undefined ? o.hi : S.highlight) : ''}
      ${o.spots ? spotLayer() : ''}
      ${compare ? `<line id="divider" x1="${pos}" x2="${pos}" y1="0" y2="1024" stroke="#1f2328" stroke-width="5"/>` : ''}
    </svg></div>

  const h1 = HOT[0].where, h2 = (HOT[1] || HOT[0]).where, s1 = SAFE[0].where;
  const total = B.length, I = count(1), D = count(2), X = count(3);
  const REPORTS = [

    { name: 'Reconstruction plan', team: 'Assignment team',
      text: `Order of work: make the ${h1} safe first, then assess the ${D} damaged buildings on the ground, then plan rebuilding. Money needed: not available offline. Time needed: not available offline.` },
  ];
  const SOURCES = { EMS98: 'EMS-98', IWGSEM: 'IWG-SEM Building Damage Assessment', INSARAG2B: 'INSARAG Guidelines 2020, Volume II, Manual B', INSARAG3: 'INSARAG Guidelines 2020, Volume III', XBD: 'xBD' };

  function streamReport(all) {
    clearTimers();
    const box = document.getElementById('rpt');
    if (!box) return;
    const tokens = REPORTS[S.tab].text.split(' ');
    const cites = tokens.filter(t => /^\[.+\][.,]?$/.test(t)).length;
    box.innerHTML = '';
    const add = t => {
      const m = t.match(/^\[(.+)\]([.,]?)$/);
      if (m) {
        const b = document.createElement('button');
        b.className = 'cite'; b.dataset.act = 'cite'; b.dataset.id = m[1]; b.textContent = m[1];
        box.append(b, document.createTextNode(m[2] + ' '));
      } else box.append(document.createTextNode(t + ' '));
    };
    const finish = () => {
      const c = document.getElementById('checks');
      if (c) c.hidden = false;
      const chip = document.getElementById('citeChip');
      if (chip) chip.textContent = cites ? `Citations: ${cites} of ${cites} found in the guideline index` : 'No citations in this report';
    };
    if (all || reduced() || noGpu()) { tokens.forEach(add); finish(); return; }
    let i = 0;
    const tm = setInterval(() => {
      if (i >= tokens.length) { clearInterval(tm); finish(); return; }
      add(tokens[i++]);
    }, 45);
    timers.push(tm);
  }
  function runChain() {
    clearTimers();
    const items = [...document.querySelectorAll('#chain li')];
    const end = document.getElementById('chainEnd');
    if (!items.length) return;
    const stopAt = noBefore() ? 0 : items.length;
    const paint = n => items.forEach((li, i) => {
      li.className = i < n ? 'done' : i === n ? (noBefore() && n === 0 ? 'fail' : 'now') : '';
      li.querySelector('.dot').textContent = i < n ? '✓' : (noBefore() && i === 0 ? '!' : i + 1);
    });
    if (reduced() || noGpu() || noBefore()) { paint(stopAt); end.hidden = false; return; }
    let n = 0; paint(0);
    const tm = setInterval(() => {
      n++; paint(n);
      if (n >= items.length) { clearInterval(tm); end.hidden = false; }
    }, 800);
    timers.push(tm);
  }

  /* ---------- Notes beside each screen ---------- */
  const NOTES = {
    s1: { why: 'The public story, for people with no background. One look, results in motion, and one thing they can touch.', data: ['Before/after slider: gallery pairs from the validation set.', 'Recordings: our own footage of the live offline run.'], states: ['Reduced motion: the steps appear without animation.'], open: ['Project name, look and headline wording.'] },
    s2: { why: 'Start the demo with a known pair or your own. Gallery pairs come from the validation set, so the site can show real accuracy on each one.', data: ['A short gallery export: 4–6 pairs with masks, building facts and heatmaps.', 'In this wireframe, every pair opens the same made-up town.'], states: ['No before-photo: the upload says so before anything runs.', 'No GPU: uploads off, results computed in advance, and labelled.'], open: ['Which 4–6 pairs. Include a hard one, such as Turkey.'] },
    s3: { why: 'The animation explains the pipeline: each step appears in order. It also shows that nothing leaves the laptop.', data: ['The local Python service at the booth.', 'Precomputed files on the public site, which has no GPU.'], states: ['No before-photo: stops at step 1 and offers two ways on.'], open: ['Real step timings, from the chain test (E7).'] },
    s4: { why: 'The core screen. Slide between photos, switch damage layers by class, click a building for its facts, click a count to light up its buildings.', data: ['One row per building from the chain\'s table: grade, position, area, distance to the nearest destroyed building.'], states: ['Facts missing: "No data", never 0. Today\'s loader returns zeros for an image it doesn\'t have, so this needs fixing.', 'No before-photo: a label saying rubble may be missed.'], open: ['Which model draws the map is settled by the chain test (E7). This layout doesn\'t change either way.'] },
    s5: { why: 'Where to look first, and where to stage. It\'s a guide built from the damage map, not a detector of survivors.', data: ['The heatmap code, run on this chain\'s map, so hot spots and counts cover the same images. Today they share only 7.'], states: ['Facts missing: says search everywhere, instead of showing an empty, safe-looking map.'], open: ['Show metres instead of pixels once image scale is known for each event.'] },
    s6: { why: 'Questions come from a menu because no small model wrote its own SQL reliably (best 73.9% against a 90% bar). Each query is written and tested once.', data: ['Fixed queries on the building table. The column names shown are the real ones.'], states: ['No match: says none match.', 'Facts missing: says no data, not zero.'], open: ['The final list of templates. Three are drawn here.'] },
    s7: { why: 'The six reports DisasTeller writes, appearing as they\'re written, with citations you can open. Figures that need outside data say "not available offline" instead of being invented.', data: ['Facts: the chain\'s table and hot spots.', 'Citations: the offline guideline search. The IDs shown are real; the wording is sample.'], states: ['Facts missing: the report stops.', 'No GPU: labelled as computed in advance.'], open: ['Who writes: the 7B or a small text model (test T2b).', 'Agents or a fixed flow (Ridita\'s next practice run).'] },
    s8: { why: 'The honest page. Real numbers, with the model behind each one, and plain limits.', data: ['Measured numbers from our results folders. This is the one screen that isn\'t sample data.'], states: ['Until the chain test (E7) runs, the banner says the numbers come from three models.'], open: ['Replace with one chain\'s numbers after E7, including the test-set scores.'] },
  };

  /* ---------- Painting and events ---------- */
  const frame = document.getElementById('frame');
  function paint() {
    clearTimers();
    const sc = SCREENS.find(x => x.id === S.screen);
    frame.innerHTML = `<div class="chrome"><span class="url">${sc.url}</span>${S.screen === 's1' || S.screen === 's8' ? '' : modeChip()}</div>${render[S.screen]()}`;
    const n = NOTES[S.screen];
    document.getElementById('notes').innerHTML = `<h3>What this screen is for</h3><p>${n.why}</p>
      <h3>Where its data comes from</h3><ul>${n.data.map(x => `<li>${x}</li>`).join('')}</ul>
      <h3>Awkward states</h3><ul>${n.states.map(x => `<li>${x}</li>`).join('')}</ul>
      <h3>Still open</h3><ul>${n.open.map(x => `<li>${x}</li>`).join('')}</ul>`;
    document.querySelectorAll('#rail button').forEach(b => {
      if (b.dataset.go === S.screen) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    document.getElementById('railSelect').value = S.screen;
    if (S.screen === 's3') runChain();
    if (S.screen === 's7') streamReport(false);
  }
  function go(id) {
    S.screen = id;
    if (location.hash !== '#' + id) history.pushState(null, '', '#' + id);
    paint();
    window.scrollTo(0, 0);
  }
  /* Repaint without losing the keyboard's place */
  function repaintKeepFocus(sel) {
    paint();
    if (sel) { const el = frame.querySelector(sel); if (el) el.focus(); }
  }

  document.addEventListener('click', e => {
    const goEl = e.target.closest('[data-go]');
    const el = e.target.closest('[data-act]');
    if (el) {
      const id = el.dataset.id, act = el.dataset.act;
      if (act === 'pick') { S.selected = S.selected === +id ? null : +id; repaintKeepFocus(`[data-act="pick"][data-id="${id}"]`); return; }
      if (act === 'showClass') {
        const c = +id, on = S.highlightClass === c && S.highlight;
        S.highlight = on ? null : B.filter(b => b.c === c).map(b => b.id);
        S.highlightClass = on ? null : c;
        repaintKeepFocus(`[data-act="showClass"][data-id="${id}"]`); return;
      }
      if (act === 'pair') { S.pair = +id; repaintKeepFocus(`[data-act="pair"][data-id="${id}"]`); return; }
      if (act === 'spot') { S.spot = S.spot === id ? null : id; repaintKeepFocus(`button[data-act="spot"][data-id="${id}"]`); return; }
      if (act === 'tmpl') { S.tmpl = +id; S.showSql = false; repaintKeepFocus(`[data-act="tmpl"][data-id="${id}"]`); return; }
      if (act === 'sql') { S.showSql = !S.showSql; repaintKeepFocus('[data-act="sql"]'); return; }
      if (act === 'tab') { S.tab = +id; S.cite = null; repaintKeepFocus(`[data-act="tab"][data-id="${id}"]`); return; }
      if (act === 'mapView') { S.mapView = id; repaintKeepFocus(`[data-act="mapView"][data-id="${id}"]`); return; }
      if (act === 'replay') { runChain(); return; }
      if (act === 'skip') { streamReport(true); return; }
      if (act === 'cite') {
        const src = SOURCES[id.split('-')[0]] || 'Guideline index';
        document.getElementById('citePanel').innerHTML = `<div class="box"><b class="mono">${id}</b><p class="small muted" style="margin-top:4px">From ${src}. The section's own text opens here, from the offline guideline search.</p></div>`;
        return;
      }
    }
    if (goEl) go(goEl.dataset.go);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const g = e.target.closest && e.target.closest('g[data-act]');
    if (g) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  document.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.input;
    if (k !== 'slider') return;
    S.slider = +e.target.value;
    const pos = 1024 * S.slider / 100, r = document.getElementById('clipRect'), d = document.getElementById('divider');
    if (r) { r.setAttribute('x', pos); r.setAttribute('width', 1024 - pos); }
    if (d) { d.setAttribute('x1', pos); d.setAttribute('x2', pos); }
  });
  document.addEventListener('change', e => {
    const t = e.target, k = t.dataset && t.dataset.input;
    if (k === 'layer') { S.layers[t.dataset.id] = t.checked; repaintKeepFocus(`[data-input="layer"][data-id="${t.dataset.id}"]`); }
    if (k === 'heat') { S.heatOn = t.checked; repaintKeepFocus('[data-input="heat"]'); }
    if (k === 'cls') { S.cls = t.value; repaintKeepFocus('[data-input="cls"]'); }
    if (k === 'part') { S.part = t.value; repaintKeepFocus('[data-input="part"]'); }
    if (k === 'dist') { S.dist = +t.value; repaintKeepFocus('[data-input="dist"]'); }
    if (k === 'size') { S.size = +t.value; repaintKeepFocus('[data-input="size"]'); }
  });

  /* ---------- The viewer's own controls ---------- */
  let lastGroup = '';
  document.getElementById('rail').innerHTML = SCREENS.map((s, i) => {
    const head = s.group !== lastGroup ? `<h3>${s.group}</h3>` : '';
    lastGroup = s.group;
    return `${head}<button data-go="${s.id}">${i + 1}. ${s.name}</button>`;
  }).join('');
  document.getElementById('railSelect').innerHTML = SCREENS.map((s, i) => `<option value="${s.id}">${i + 1}. ${s.name}</option>`).join('');
  document.getElementById('railSelect').addEventListener('change', e => go(e.target.value));
  document.getElementById('scenario').addEventListener('change', e => { S.scenario = e.target.value; paint(); });
  document.getElementById('notesToggle').addEventListener('change', e => document.body.classList.toggle('nonotes', !e.target.checked));
  function fromHash() {
    const id = location.hash.slice(1);
    if (SCREENS.some(s => s.id === id)) S.screen = id;
    paint();
  }
  window.addEventListener('popstate', fromHash);
  fromHash();
})();
</script>
</body>
</html>
